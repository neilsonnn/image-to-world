name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Install video tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install video tools (macOS)
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || brew install ffmpeg
      - name: Install pinned headless renderer
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/render-browser
        run: |
          bun node_modules/playwright-core/cli.js install --with-deps --only-shell chromium
          browser=$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -name chrome-headless-shell)
          test -x "$browser"
          echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
      - run: bun run check
      - run: bun run build
      - run: bun run test
      - name: Verify launch without provider credentials
        run: bun scripts/smoke-launch.ts
